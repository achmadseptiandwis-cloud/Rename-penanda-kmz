<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMZ Batch Rename Tool (Telecom Design)</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JS Libraries: JSZip, toGeoJSON, tokml, Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.1/tokml.js"></script>

    <style>
        :root {
            --bg-dark: #1e2530;
            --bg-panel: #f8f9fa;
            --primary-blue: #0d6efd;
            --success-green: #198754;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navbar-custom {
            background-color: var(--bg-dark);
            color: white;
            padding: 10px 20px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .sidebar-content {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .upload-box {
            border: 2px dashed #0d6efd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #f0f7ff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-box:hover {
            background-color: #e1f0ff;
        }

        .rename-panel {
            background-color: #f1f3f5;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #e9ecef;
        }

        .placemark-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .placemark-item input {
            border: 1px solid transparent;
            background: transparent;
            font-weight: 500;
            width: 100%;
        }

        .placemark-item input:focus {
            border-bottom: 1px solid var(--primary-blue);
            outline: none;
            background-color: #fff;
        }

        .folder-header {
            font-weight: 600;
            color: #495057;
            margin-top: 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .badge-count {
            font-size: 0.75rem;
            background-color: #e9ecef;
            color: #495057;
            padding: 2px 8px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-map-location-dot fa-lg text-primary"></i>
            <h5 class="m-0 font-weight-bold">KMZ Batch Rename Tool (Telecom Design)</h5>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-light" onclick="document.getElementById('kmzFileInput').click()">
                <i class="fa-solid fa-folder-open me-1"></i> Buka File KMZ
            </button>
            <button class="btn btn-sm btn-success" onclick="exportKMZ()">
                <i class="fa-solid fa-download me-1"></i> Simpan & Export KMZ
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-content">
                <!-- Upload Section -->
                <input type="file" id="kmzFileInput" accept=".kmz,.kml" style="display: none;" onchange="handleFileSelect(event)">
                <div class="upload-box" onclick="document.getElementById('kmzFileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up fa-2x text-primary mb-2"></i>
                    <h6 class="m-0 fw-bold">Upload File KMZ / KML</h6>
                    <small class="text-muted">Tarik & lepas file KMZ Anda di sini atau klik untuk memilih</small>
                </div>

                <!-- Fast Auto-Rename Folder Section -->
                <div class="rename-panel">
                    <div class="fw-bold text-uppercase text-secondary mb-2" style="font-size: 0.75rem;">
                        <i class="fa-solid fa-bolt text-warning me-1"></i> Fast Auto-Rename Folder
                    </div>
                    
                    <div class="mb-2">
                        <select id="folderSelect" class="form-select form-select-sm">
                            <option value="">-- Pilih Folder --</option>
                        </select>
                    </div>

                    <div class="input-group input-group-sm mb-2">
                        <input type="text" id="prefixInput" class="form-control" placeholder="Prefix (misal: FDI - )">
                        <input type="number" id="startNumInput" class="form-control" value="1" style="max-width: 60px;" min="0">
                        <select id="numberFormatSelect" class="form-select" style="max-width: 110px;">
                            <option value="none">Tanpa Nomor</option>
                            <option value="001" selected>001</option>
                            <option value="01">01</option>
                            <option value="1">1</option>
                        </select>
                    </div>

                    <button class="btn btn-primary btn-sm w-100 fw-semibold" onclick="applyBatchRename()">
                        <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Terapkan Penamaan Urut
                    </button>
                </div>

                <!-- Placemark List Output -->
                <div id="placemarkTree" class="mt-3">
                    <div class="text-center text-muted py-4" style="font-size: 0.85rem;">
                        Belum ada file yang diunggah.
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Section -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Inisialisasi Peta Leaflet
        const map = L.map('map').setView([-2.548926, 118.014863], 5); // Default Indonesia
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let geojsonGroup = L.featureGroup().addTo(map);
        let parsedKmlDoc = null;
        let kmzZipArchive = null;
        let kmlFileName = "doc.kml";
        let placemarkDataList = [];

        // Dynamic Input Enable/Disable when "Tanpa Nomor" selected
        document.getElementById('numberFormatSelect').addEventListener('change', function(e) {
            const startNumInput = document.getElementById('startNumInput');
            if (e.target.value === 'none') {
                startNumInput.disabled = true;
                startNumInput.style.opacity = '0.4';
            } else {
                startNumInput.disabled = false;
                startNumInput.style.opacity = '1';
            }
        });

        // Handle Upload File
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            geojsonGroup.clearLayers();
            placemarkDataList = [];

            try {
                let kmlText = "";
                if (file.name.endsWith('.kmz')) {
                    kmzZipArchive = await JSZip.loadAsync(file);
                    const kmlFile = Object.keys(kmzZipArchive.files).find(name => name.endsWith('.kml'));
                    if (!kmlFile) throw new Error("File KML tidak ditemukan di dalam KMZ");
                    kmlFileName = kmlFile;
                    kmlText = await kmzZipArchive.files[kmlFile].async("string");
                } else {
                    kmlText = await file.text();
                    kmzZipArchive = null;
                }

                const parser = new DOMParser();
                parsedKmlDoc = parser.parseFromString(kmlText, "text/xml");

                parseAndRenderKML();
            } catch (err) {
                alert("Gagal membaca file KMZ/KML: " + err.message);
            }
        }

        // Parse DOM KML & Display
        function parseAndRenderKML() {
            if (!parsedKmlDoc) return;

            placemarkDataList = [];
            const folderSelect = document.getElementById('folderSelect');
            folderSelect.innerHTML = '<option value="">-- Pilih Folder --</option>';

            const folders = parsedKmlDoc.querySelectorAll('Folder');
            
            // If no folder exists, use main document as root
            let folderIndex = 0;

            if (folders.length === 0) {
                const placemarks = parsedKmlDoc.querySelectorAll('Placemark');
                processPlacemarkNodes(placemarks, "Utama", "folder_0");
                folderSelect.innerHTML += `<option value="folder_0">Folder Utama (${placemarks.length} penanda)</option>`;
            } else {
                folders.forEach((folder) => {
                    const folderNameNode = folder.querySelector('name');
                    const folderName = folderNameNode ? folderNameNode.textContent : `Folder ${folderIndex + 1}`;
                    const folderId = `folder_${folderIndex}`;
                    
                    // Direct placemarks in this folder
                    const placemarks = Array.from(folder.children).filter(node => node.tagName === 'Placemark');
                    if (placemarks.length > 0) {
                        processPlacemarkNodes(placemarks, folderName, folderId);
                        folderSelect.innerHTML += `<option value="${folderId}">${folderName} (${placemarks.length} penanda)</option>`;
                    }
                    folderIndex++;
                });
            }

            renderSidebarTree();
            renderMapLayers();
        }

        function processPlacemarkNodes(placemarkNodes, folderName, folderId) {
            placemarkNodes.forEach((pm, idx) => {
                const nameNode = pm.querySelector('name');
                const currentName = nameNode ? nameNode.textContent : `Placemark ${idx + 1}`;
                
                placemarkDataList.push({
                    id: `pm_${folderId}_${idx}`,
                    node: pm,
                    nameNode: nameNode,
                    folderId: folderId,
                    folderName: folderName,
                    name: currentName
                });
            });
        }

        function renderSidebarTree() {
            const container = document.getElementById('placemarkTree');
            container.innerHTML = '';

            const grouped = {};
            placemarkDataList.forEach(item => {
                if (!grouped[item.folderId]) {
                    grouped[item.folderId] = {
                        name: item.folderName,
                        items: []
                    };
                }
                grouped[item.folderId].items.push(item);
            });

            for (let fId in grouped) {
                const group = grouped[fId];
                const folderHtml = `
                    <div class="folder-header">
                        <span><i class="fa-solid fa-folder text-warning me-1"></i> ${group.name}</span>
                        <span class="badge-count">${group.items.length} penanda</span>
                    </div>
                `;
                container.innerHTML += folderHtml;

                group.items.forEach(item => {
                    const itemHtml = `
                        <div class="placemark-item">
                            <i class="fa-solid fa-location-dot text-danger me-2"></i>
                            <input type="text" value="${item.name}" onchange="updateSingleName('${item.id}', this.value)">
                            <i class="fa-solid fa-crosshairs text-muted ms-1" style="cursor:pointer;" title="Fokus Lokasi" onclick="focusMapItem('${item.id}')"></i>
                        </div>
                    `;
                    container.innerHTML += itemHtml;
                });
            }
        }

        function renderMapLayers() {
            geojsonGroup.clearLayers();
            const geojson = toGeoJSON.kml(parsedKmlDoc);
            
            const layer = L.geoJSON(geojson, {
                onEachFeature: function (feature, layer) {
                    if (feature.properties && feature.properties.name) {
                        layer.bindPopup(`<b>${feature.properties.name}</b>`);
                    }
                }
            });
            geojsonGroup.addLayer(layer);

            if (geojsonGroup.getBounds().isValid()) {
                map.fitBounds(geojsonGroup.getBounds());
            }
        }

        // Auto Rename Batch Logic
        function applyBatchRename() {
            const selectedFolderId = document.getElementById('folderSelect').value;
            const prefix = document.getElementById('prefixInput').value;
            const startNumInput = document.getElementById('startNumInput');
            const startNum = parseInt(startNumInput.value, 10) || 1;
            const format = document.getElementById('numberFormatSelect').value;

            if (!selectedFolderId) {
                alert("Pilih folder terlebih dahulu!");
                return;
            }

            const targetItems = placemarkDataList.filter(item => item.folderId === selectedFolderId);

            targetItems.forEach((item, index) => {
                let newName = "";

                if (format === 'none') {
                    // Jika memilih "Tanpa Nomor", nama hanya menggunakan Prefix saja
                    newName = prefix;
                } else {
                    // Format Penomoran
                    const currentNum = startNum + index;
                    let formattedNum = currentNum.toString();

                    if (format === '001') {
                        formattedNum = currentNum.toString().padStart(3, '0');
                    } else if (format === '01') {
                        formattedNum = currentNum.toString().padStart(2, '0');
                    }

                    newName = `${prefix}${formattedNum}`;
                }

                item.name = newName;
                if (item.nameNode) {
                    item.nameNode.textContent = newName;
                } else {
                    const newNameNode = parsedKmlDoc.createElement('name');
                    newNameNode.textContent = newName;
                    item.node.appendChild(newNameNode);
                    item.nameNode = newNameNode;
                }
            });

            renderSidebarTree();
            renderMapLayers();
        }

        function updateSingleName(itemId, newName) {
            const item = placemarkDataList.find(i => i.id === itemId);
            if (item) {
                item.name = newName;
                if (item.nameNode) {
                    item.nameNode.textContent = newName;
                }
                renderMapLayers();
            }
        }

        // Export/Download File KMZ
        async function exportKMZ() {
            if (!parsedKmlDoc) {
                alert("Tidak ada data KMZ/KML yang diunggah!");
                return;
            }

            const serializer = new XMLSerializer();
            const kmlString = serializer.serializeToString(parsedKmlDoc);

            const zip = new JSZip();
            zip.file(kmlFileName, kmlString);

            // Copy assets if originally KMZ
            if (kmzZipArchive) {
                for (let filename in kmzZipArchive.files) {
                    if (filename !== kmlFileName && !kmzZipArchive.files[filename].dir) {
                        const blob = await kmzZipArchive.files[filename].async("blob");
                        zip.file(filename, blob);
                    }
                }
            }

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "Edited_Output.kmz";
            link.click();
        }
    </script>
</body>
</html>
