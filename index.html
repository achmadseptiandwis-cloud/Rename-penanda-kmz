<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMZ Batch Rename & CSV Tool (Telecom Design)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JS Libraries: JSZip, toGeoJSON, Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

    <style>
        :root {
            --bg-main: #f4f6f9;
            --bg-surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary-accent: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        /* Header Navbar */
        .navbar-custom {
            background-color: #0f172a;
            color: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1001;
        }

        .navbar-brand-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Layout Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 410px;
            background-color: var(--bg-main);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .sidebar-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Map Styling */
        .map-container {
            flex: 1;
            position: relative;
            background-color: #e5e7eb;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Card Panels */
        .custom-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--card-shadow);
        }

        /* Upload Box */
        .upload-box {
            border: 2px dashed #93c5fd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background-color: #eff6ff;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .upload-box:hover {
            background-color: #dbeafe;
            border-color: var(--primary-accent);
            transform: translateY(-1px);
        }

        .card-title-sub {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Placemark List Items */
        .folder-header {
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }

        .badge-count {
            font-size: 0.75rem;
            background-color: #e2e8f0;
            color: #475569;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .placemark-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.875rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.15s ease;
        }

        .placemark-item:hover {
            border-color: #cbd5e1;
            box-shadow: var(--card-shadow);
        }

        .placemark-item input {
            border: 1px solid transparent;
            background: transparent;
            font-weight: 500;
            color: var(--text-primary);
            width: 100%;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .placemark-item input:focus {
            border-color: var(--primary-accent);
            background-color: #fff;
            outline: none;
        }

        /* Buttons & Form Inputs */
        .btn-primary {
            background-color: var(--primary-accent);
            border-color: var(--primary-accent);
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .form-control, .form-select {
            border-radius: 8px;
            border-color: var(--border-color);
            font-size: 0.875rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-focus-map {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .btn-focus-map:hover {
            color: var(--primary-accent);
            background-color: #f1f5f9;
        }

        #exportStatus {
            font-size: 0.75rem;
            color: #0284c7;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-layer-group text-primary fa-lg"></i>
            <span class="navbar-brand-title">KMZ Batch Rename & CSV Tool</span>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-danger rounded-2 px-3" onclick="resetFileWorkspace()">
                <i class="fa-solid fa-trash-can me-1"></i> Hapus File
            </button>
            <button class="btn btn-sm btn-outline-light rounded-2 px-3" onclick="document.getElementById('kmzFileInput').click()">
                <i class="fa-solid fa-folder-open me-1"></i> Buka File
            </button>
            <button class="btn btn-sm btn-success rounded-2 px-3 fw-medium" onclick="exportKMZ()">
                <i class="fa-solid fa-file-export me-1"></i> Export KMZ
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-content">
                
                <!-- Upload Section -->
                <input type="file" id="kmzFileInput" accept=".kmz,.kml" style="display: none;" onchange="handleFileSelect(event)">
                <div class="upload-box" onclick="document.getElementById('kmzFileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up fa-2x text-primary mb-2"></i>
                    <h6 class="m-0 fw-semibold text-dark">Upload File KMZ / KML</h6>
                    <small class="text-secondary">Klik atau seret file Anda ke area ini</small>
                </div>

                <!-- Fast Auto-Rename Folder Section -->
                <div class="custom-card">
                    <div class="card-title-sub">
                        <span><i class="fa-solid fa-bolt text-warning me-1"></i> Fast Auto-Rename</span>
                    </div>
                    
                    <div class="mb-2">
                        <select id="folderSelect" class="form-select">
                            <option value="">-- Pilih Folder Target --</option>
                        </select>
                    </div>

                    <div class="input-group mb-3">
                        <input type="text" id="prefixInput" class="form-control" placeholder="Prefix (misal: FDI - )">
                        <input type="number" id="startNumInput" class="form-control" value="1" style="max-width: 60px;" min="0">
                        <select id="numberFormatSelect" class="form-select" style="max-width: 120px;">
                            <option value="none">Tanpa Nomor</option>
                            <option value="001" selected>001</option>
                            <option value="01">01</option>
                            <option value="1">1</option>
                        </select>
                    </div>

                    <button class="btn btn-primary w-100 fw-semibold" onclick="applyBatchRename()">
                        <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Terapkan Penamaan
                    </button>
                </div>

                <!-- Export CSV Per Folder Section -->
                <div class="custom-card">
                    <div class="card-title-sub">
                        <span><i class="fa-solid fa-file-csv text-success me-1"></i> Export Folder ke CSV</span>
                    </div>
                    <div class="mb-2">
                        <select id="csvFolderSelect" class="form-select">
                            <option value="">-- Pilih Folder untuk CSV --</option>
                        </select>
                    </div>
                    <button id="btnExportCSV" class="btn btn-outline-success w-100 fw-semibold" onclick="exportFolderToCSV()">
                        <i class="fa-solid fa-download me-1"></i> Download CSV (Terpisah Kolom Alamat)
                    </button>
                    <div id="exportStatus" class="mt-2 text-center"></div>
                </div>

                <!-- Placemark List Output -->
                <div class="custom-card flex-grow-1" style="overflow-y: auto;">
                    <div class="card-title-sub">
                        <span><i class="fa-solid fa-list-check me-1"></i> Daftar Penanda (Placemark)</span>
                        <button class="btn btn-link btn-sm text-danger p-0 text-decoration-none" style="font-size: 0.75rem;" onclick="resetFileWorkspace()">
                            <i class="fa-solid fa-rotate-left"></i> Reset
                        </button>
                    </div>
                    <div id="placemarkTree">
                        <div class="text-center text-secondary py-4" style="font-size: 0.875rem;">
                            Belum ada file yang diunggah.
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Map Section -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Inisialisasi Peta Leaflet
        const map = L.map('map', { zoomControl: false }).setView([-2.548926, 118.014863], 5);
        
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let geojsonGroup = L.featureGroup().addTo(map);
        let parsedKmlDoc = null;
        let kmzZipArchive = null;
        let kmlFileName = "doc.kml";
        let placemarkDataList = [];

        // Enable/Disable Input Angka saat opsi "Tanpa Nomor" dipilih
        document.getElementById('numberFormatSelect').addEventListener('change', function(e) {
            const startNumInput = document.getElementById('startNumInput');
            if (e.target.value === 'none') {
                startNumInput.disabled = true;
                startNumInput.style.opacity = '0.4';
            } else {
                startNumInput.disabled = false;
                startNumInput.style.opacity = '1';
            }
        });

        // Fitur Hapus/Reset File yang sedang dibuka
        function resetFileWorkspace() {
            geojsonGroup.clearLayers();
            parsedKmlDoc = null;
            kmzZipArchive = null;
            placemarkDataList = [];
            document.getElementById('kmzFileInput').value = '';
            document.getElementById('folderSelect').innerHTML = '<option value="">-- Pilih Folder Target --</option>';
            document.getElementById('csvFolderSelect').innerHTML = '<option value="">-- Pilih Folder untuk CSV --</option>';
            document.getElementById('prefixInput').value = '';
            document.getElementById('exportStatus').textContent = '';
            document.getElementById('placemarkTree').innerHTML = `
                <div class="text-center text-secondary py-4" style="font-size: 0.875rem;">
                    Belum ada file yang diunggah.
                </div>
            `;
            map.setView([-2.548926, 118.014863], 5);
        }

        // Handle Upload File
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            resetFileWorkspace();

            try {
                let kmlText = "";
                if (file.name.endsWith('.kmz')) {
                    kmzZipArchive = await JSZip.loadAsync(file);
                    const kmlFile = Object.keys(kmzZipArchive.files).find(name => name.endsWith('.kml'));
                    if (!kmlFile) throw new Error("File KML tidak ditemukan di dalam KMZ");
                    kmlFileName = kmlFile;
                    kmlText = await kmzZipArchive.files[kmlFile].async("string");
                } else {
                    kmlText = await file.text();
                    kmzZipArchive = null;
                }

                const parser = new DOMParser();
                parsedKmlDoc = parser.parseFromString(kmlText, "text/xml");

                parseAndRenderKML();
            } catch (err) {
                alert("Gagal membaca file KMZ/KML: " + err.message);
            }
        }

        function parseAndRenderKML() {
            if (!parsedKmlDoc) return;

            placemarkDataList = [];
            const folderSelect = document.getElementById('folderSelect');
            const csvFolderSelect = document.getElementById('csvFolderSelect');
            
            folderSelect.innerHTML = '<option value="">-- Pilih Folder Target --</option>';
            csvFolderSelect.innerHTML = '<option value="">-- Pilih Folder untuk CSV --</option>';

            const folders = parsedKmlDoc.querySelectorAll('Folder');
            let folderIndex = 0;

            if (folders.length === 0) {
                const placemarks = parsedKmlDoc.querySelectorAll('Placemark');
                processPlacemarkNodes(placemarks, "Folder Utama", "folder_0");
                const optHtml = `<option value="folder_0">Folder Utama (${placemarks.length} penanda)</option>`;
                folderSelect.innerHTML += optHtml;
                csvFolderSelect.innerHTML += optHtml;
            } else {
                folders.forEach((folder) => {
                    const folderNameNode = folder.querySelector('name');
                    const folderName = folderNameNode ? folderNameNode.textContent : `Folder ${folderIndex + 1}`;
                    const folderId = `folder_${folderIndex}`;
                    
                    const placemarks = Array.from(folder.children).filter(node => node.tagName === 'Placemark');
                    if (placemarks.length > 0) {
                        processPlacemarkNodes(placemarks, folderName, folderId);
                        const optHtml = `<option value="${folderId}">${folderName} (${placemarks.length} penanda)</option>`;
                        folderSelect.innerHTML += optHtml;
                        csvFolderSelect.innerHTML += optHtml;
                    }
                    folderIndex++;
                });
            }

            renderSidebarTree();
            renderMapLayers();
        }

        function processPlacemarkNodes(placemarkNodes, folderName, folderId) {
            placemarkNodes.forEach((pm, idx) => {
                const nameNode = pm.querySelector('name');
                const currentName = nameNode ? nameNode.textContent : `Placemark ${idx + 1}`;
                
                // Ambil Koordinat
                let lat = null, lng = null;
                const pointNode = pm.querySelector('Point coordinates');
                if (pointNode) {
                    const coords = pointNode.textContent.trim().split(',');
                    if (coords.length >= 2) {
                        lng = parseFloat(coords[0]);
                        lat = parseFloat(coords[1]);
                    }
                }
                
                placemarkDataList.push({
                    id: `pm_${folderId}_${idx}`,
                    node: pm,
                    nameNode: nameNode,
                    folderId: folderId,
                    folderName: folderName,
                    name: currentName,
                    lat: lat,
                    lng: lng
                });
            });
        }

        function renderSidebarTree() {
            const container = document.getElementById('placemarkTree');
            container.innerHTML = '';

            const grouped = {};
            placemarkDataList.forEach(item => {
                if (!grouped[item.folderId]) {
                    grouped[item.folderId] = {
                        name: item.folderName,
                        items: []
                    };
                }
                grouped[item.folderId].items.push(item);
            });

            for (let fId in grouped) {
                const group = grouped[fId];
                const folderHtml = `
                    <div class="folder-header">
                        <span><i class="fa-solid fa-folder text-warning me-1"></i> ${group.name}</span>
                        <span class="badge-count">${group.items.length}</span>
                    </div>
                `;
                container.innerHTML += folderHtml;

                group.items.forEach(item => {
                    const itemHtml = `
                        <div class="placemark-item">
                            <i class="fa-solid fa-location-dot text-danger me-2"></i>
                            <input type="text" value="${item.name}" onchange="updateSingleName('${item.id}', this.value)">
                            <i class="fa-solid fa-crosshairs btn-focus-map ms-1" title="Fokus Lokasi" onclick="focusMapItem(${item.lat}, ${item.lng})"></i>
                        </div>
                    `;
                    container.innerHTML += itemHtml;
                });
            }
        }

        function renderMapLayers() {
            geojsonGroup.clearLayers();
            const geojson = toGeoJSON.kml(parsedKmlDoc);
            
            const layer = L.geoJSON(geojson, {
                onEachFeature: function (feature, layer) {
                    if (feature.properties && feature.properties.name) {
                        layer.bindPopup(`<b>${feature.properties.name}</b>`);
                    }
                }
            });
            geojsonGroup.addLayer(layer);

            if (geojsonGroup.getBounds().isValid()) {
                map.fitBounds(geojsonGroup.getBounds(), { padding: [30, 30] });
            }
        }

        function focusMapItem(lat, lng) {
            if (lat && lng) {
                map.setView([lat, lng], 17);
            }
        }

        function applyBatchRename() {
            const selectedFolderId = document.getElementById('folderSelect').value;
            const prefix = document.getElementById('prefixInput').value;
            const startNumInput = document.getElementById('startNumInput');
            const startNum = parseInt(startNumInput.value, 10) || 1;
            const format = document.getElementById('numberFormatSelect').value;

            if (!selectedFolderId) {
                alert("Pilih folder target terlebih dahulu!");
                return;
            }

            const targetItems = placemarkDataList.filter(item => item.folderId === selectedFolderId);

            targetItems.forEach((item, index) => {
                let newName = "";

                if (format === 'none') {
                    newName = prefix;
                } else {
                    const currentNum = startNum + index;
                    let formattedNum = currentNum.toString();

                    if (format === '001') {
                        formattedNum = currentNum.toString().padStart(3, '0');
                    } else if (format === '01') {
                        formattedNum = currentNum.toString().padStart(2, '0');
                    }

                    newName = `${prefix}${formattedNum}`;
                }

                item.name = newName;
                if (item.nameNode) {
                    item.nameNode.textContent = newName;
                } else {
                    const newNameNode = parsedKmlDoc.createElement('name');
                    newNameNode.textContent = newName;
                    item.node.appendChild(newNameNode);
                    item.nameNode = newNameNode;
                }
            });

            renderSidebarTree();
            renderMapLayers();
        }

        function updateSingleName(itemId, newName) {
            const item = placemarkDataList.find(i => i.id === itemId);
            if (item) {
                item.name = newName;
                if (item.nameNode) {
                    item.nameNode.textContent = newName;
                }
                renderMapLayers();
            }
        }

        // Fitur Export CSV dengan Pemisahan Detail Lokasi per Kolom
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function getAddressFromCoordinates(lat, lng) {
            const emptyAddress = {
                road: "-",
                subdistrict: "-",
                district: "-",
                city: "-",
                state: "-",
                postcode: "-",
                full: "-"
            };

            if (!lat || !lng) return emptyAddress;

            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'KMZBatchRenameApp/1.0' }
                });

                if (response.status === 429) {
                    await delay(1200);
                    return emptyAddress;
                }

                if (!response.ok) return emptyAddress;

                const data = await response.json();
                const addr = data.address || {};

                return {
                    road: addr.road || addr.pedestrian || addr.path || "-",
                    subdistrict: addr.village || addr.suburb || addr.neighbourhood || addr.hamlet || "-",
                    district: addr.city_district || addr.district || addr.subdistrict || "-",
                    city: addr.city || addr.town || addr.regency || addr.county || "-",
                    state: addr.state || "-",
                    postcode: addr.postcode || "-",
                    full: data.display_name ? data.display_name : "-"
                };
            } catch (error) {
                return emptyAddress;
            }
        }

        // Helper untuk memformat string CSV (menghindari error jika ada tanda koma)
        function cleanCSVField(text) {
            if (!text) return '""';
            return `"${text.toString().replace(/"/g, '""')}"`;
        }

        async function exportFolderToCSV() {
            const selectedFolderId = document.getElementById('csvFolderSelect').value;
            if (!selectedFolderId) {
                alert("Pilih folder yang ingin diexport ke CSV terlebih dahulu!");
                return;
            }

            const targetItems = placemarkDataList.filter(item => item.folderId === selectedFolderId);
            if (targetItems.length === 0) {
                alert("Folder ini tidak memiliki penanda!");
                return;
            }

            const btn = document.getElementById('btnExportCSV');
            const status = document.getElementById('exportStatus');
            btn.disabled = true;

            // Header CSV Terpisah Per Kolom
            let csvContent = "Nama Penanda,Latitude,Longitude,Jalan,Kelurahan / Desa,Kecamatan,Kota / Kabupaten,Provinsi,Kode Pos,Alamat Lengkap\n";

            for (let i = 0; i < targetItems.length; i++) {
                const item = targetItems[i];
                status.textContent = `Memproses lokasi (${i + 1}/${targetItems.length})...`;

                const addr = await getAddressFromCoordinates(item.lat, item.lng);

                // Gabungkan baris data CSV
                csvContent += `${cleanCSVField(item.name)},${item.lat || ''},${item.lng || ''},${cleanCSVField(addr.road)},${cleanCSVField(addr.subdistrict)},${cleanCSVField(addr.district)},${cleanCSVField(addr.city)},${cleanCSVField(addr.state)},${cleanCSVField(addr.postcode)},${cleanCSVField(addr.full)}\n`;

                if (i < targetItems.length - 1) {
                    await delay(350);
                }
            }

            const folderName = targetItems[0].folderName || "Folder";
            downloadCSV(csvContent, `Export_${folderName.replace(/\s+/g, '_')}.csv`);

            status.textContent = "Export CSV Selesai!";
            btn.disabled = false;
        }

        function downloadCSV(csvContent, filename) {
            const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Export KMZ
        async function exportKMZ() {
            if (!parsedKmlDoc) {
                alert("Tidak ada data KMZ/KML yang diunggah!");
                return;
            }

            const serializer = new XMLSerializer();
            const kmlString = serializer.serializeToString(parsedKmlDoc);

            const zip = new JSZip();
            zip.file(kmlFileName, kmlString);

            if (kmzZipArchive) {
                for (let filename in kmzZipArchive.files) {
                    if (filename !== kmlFileName && !kmzZipArchive.files[filename].dir) {
                        const blob = await kmzZipArchive.files[filename].async("blob");
                        zip.file(filename, blob);
                    }
                }
            }

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "Edited_Output.kmz";
            link.click();
        }
    </script>
</body>
</html>
